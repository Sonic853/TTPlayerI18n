name: Manual i18n Windows Build
run-name: ttp_i18n x86 ${{ inputs.configuration }} - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置（发布使用 Release）
        type: choice
        required: true
        default: Release
        options:
          - Release
          - RelWithDebInfo
          - Debug

permissions:
  contents: read

jobs:
  build:
    name: Build shared i18n DLL (VS 2026, Windows x86)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify VS 2026 toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $capabilitiesJson = cmake -E capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Could not query CMake capabilities.' }
          $capabilities = $capabilitiesJson | ConvertFrom-Json
          if ($capabilities.generators.name -notcontains 'Visual Studio 18 2026') {
            throw 'Visual Studio 2026 requires CMake 4.2 or newer.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw 'Visual Studio 2026 with x86/x64 C++ tools was not found.'
          }
          "TTP_I18N_VS_INSTANCE=$($installation.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3 is required for tests and the import audit.' }

      # The repository contains its ABI, compatibility scripts and catalogs.
      # No sibling player checkout or original runtime DLLs are needed.
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A Win32
          "-DCMAKE_GENERATOR_INSTANCE=$env:TTP_I18N_VS_INSTANCE"
          -DBUILD_TESTING=ON

      - name: Build and audit shared DLL
        run: >-
          cmake --build build --config "$env:BUILD_CONFIGURATION"
          --target ttp_i18n ttp_i18n_catalog_tests --parallel 4

      - name: Test catalogs and translations
        run: >-
          ctest --test-dir build -C "$env:BUILD_CONFIGURATION"
          --output-on-failure --no-tests=error

      - name: Package DLL and translations
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          ./tools/package.ps1 -BuildDirectory build -Configuration "$env:BUILD_CONFIGURATION"
          -Destination artifact -SourceRevision "$env:SOURCE_REVISION"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ttp_i18n-Windows-x86-${{ inputs.configuration }}-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ttp_i18n-diagnostics-${{ inputs.configuration }}-${{ github.run_number }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/**/i18n-legacy-imports.json
          if-no-files-found: ignore
          retention-days: 7
